name: Deploy Walid Voyages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          PUBLIC_UPLOAD_API: ${{ vars.PUBLIC_UPLOAD_API }}
          PUBLIC_FLIGHTS_SEARCH_URL: ${{ vars.PUBLIC_FLIGHTS_SEARCH_URL }}
          PUBLIC_HOTELS_SEARCH_URL: ${{ vars.PUBLIC_HOTELS_SEARCH_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
